<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembagi Kelompok Realtime</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    h1 { text-align: center; color: var(--primary); margin-bottom: 6px; }
    p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 24px; }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .btn {
      background: var(--primary); color: white; border: none; padding: 10px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; width: 100%;
      transition: 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--success); }
    .btn-secondary:hover { background: #059669; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    
    input, select {
      width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
      margin-bottom: 12px; font-size: 14px; outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .room-header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
    }
    .room-code { font-size: 20px; font-weight: bold; color: var(--primary); }

    .member-grid {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .member-chip {
      background: #e0e7ff; color: #3730a3; padding: 6px 12px; border-radius: 20px;
      font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px;
    }

    .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 16px; }
    .group-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .group-card h3 { font-size: 16px; color: var(--primary); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .member-item { padding: 4px 0; display: flex; justify-content: space-between; font-size: 14px; }
    .badge-leader { background: #fef3c7; color: #d97706; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    
    .hidden { display: none; }
  </style>

  <!-- Firebase SDK (v9 Compatibility Mode) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <h1>Pembagi Kelompok Realtime</h1>
    <p class="subtitle">Anggota bisa isi nama sendiri dari HP masing-masing</p>

    <!-- Halaman Utama / Buat / Masuk Ruangan -->
    <div id="setupSection" class="card">
      <h2 style="margin-bottom: 12px; font-size: 18px;">Pilih Akses</h2>
      <button class="btn" onclick="createRoom()" style="margin-bottom: 12px;">Buat Sesi Baru (Untuk Admin/Host)</button>
      <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border);">
      <label>Atau Masuk ke Sesi yang Ada (Untuk Anggota):</label>
      <input type="text" id="inputRoomCode" placeholder="Masukkan Kode Ruangan (contoh: KLP-8492)">
      <button class="btn btn-outline" onclick="joinRoom()">Masuk Sesi</button>
    </div>

    <!-- Tampilan Ruangan -->
    <div id="roomSection" class="card hidden">
      <div class="room-header">
        <div>
          <span style="font-size: 12px; color: var(--text-muted);">Kode Ruangan:</span>
          <div id="displayRoomCode" class="room-code">---</div>
        </div>
        <button class="btn btn-outline" style="width: auto;" onclick="copyLink()">Salin Link/Kode</button>
      </div>

      <!-- Form Tambah Nama untuk Anggota -->
      <div id="joinFormCard" style="background: #f1f5f9; padding: 14px; border-radius: 8px; margin-bottom: 16px;">
        <h3 style="font-size: 15px; margin-bottom: 10px;">Isi Nama Anda:</h3>
        <input type="text" id="memberName" placeholder="Nama Lengkap / Panggilan">
        <select id="memberGender">
          <option value="L">Laki-Laki (L)</option>
          <option value="P">Perempuan (P)</option>
        </select>
        <button class="btn btn-secondary" onclick="submitName()">Kirim Nama Saya</button>
      </div>

      <!-- Daftar Anggota Terkumpul secara Realtime -->
      <div>
        <h3>Daftar Anggota Hadir (<span id="memberCount">0</span>)</h3>
        <div id="memberList" class="member-grid"></div>
      </div>

      <!-- Control Panel Khusus Admin/Host -->
      <div id="adminControls" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);">
        <h3 style="font-size: 15px; margin-bottom: 10px;">Pengaturan Acak Kelompok (Khusus Host)</h3>
        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
          <div style="flex: 1;">
            <label style="font-size: 12px;">Jumlah Kelompok:</label>
            <input type="number" id="groupCount" value="2" min="1" style="margin-bottom: 0;">
          </div>
          <div style="flex: 2; display: flex; align-items: center; gap: 10px; margin-top: 16px;">
            <label><input type="checkbox" id="balanceGender" checked> Seimbangkan Gender</label>
            <label><input type="checkbox" id="assignLeader" checked> Tentukan Ketua</label>
          </div>
        </div>
        <button class="btn" onclick="generateGroupsRealtime()">Acak & Bagikan Kelompok Now!</button>
      </div>
    </div>

    <!-- Hasil Pembagian Kelompok -->
    <div id="resultSection" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Hasil Pembagian Kelompok</h2>
        <button class="btn btn-outline" style="width: auto;" onclick="copyWhatsAppFormat()">Salin Format WA</button>
      </div>
      <div id="groupsContainer" class="groups-grid"></div>
    </div>
  </div>

  <script>
    // ⚠️ MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Inisialisasi Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentRoomCode = "";
    let roomRef = null;
    let currentMembers = {};
    let currentResultGroups = [];

    // Deteksi jika dibuka lewat link berbagi (?room=KLP-XXXX)
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        document.getElementById('inputRoomCode').value = roomParam;
        joinRoom();
      }
    };

    function createRoom() {
      const randomCode = 'KLP-' + Math.floor(1000 + Math.random() * 9000);
      currentRoomCode = randomCode;
      initRoomListener();
    }

    function joinRoom() {
      const code = document.getElementById('inputRoomCode').value.trim().toUpperCase();
      if (!code) return alert('Masukkan kode ruangan!');
      currentRoomCode = code;
      initRoomListener();
    }

    function initRoomListener() {
      document.getElementById('setupSection').classList.add('hidden');
      document.getElementById('roomSection').classList.remove('hidden');
      document.getElementById('displayRoomCode').innerText = currentRoomCode;

      roomRef = db.ref('rooms/' + currentRoomCode);

      // Pantau data anggota secara Realtime
      roomRef.child('members').on('value', (snapshot) => {
        currentMembers = snapshot.val() || {};
        renderMembers();
      });

      // Pantau data hasil kelompok secara Realtime (Semua HP otomatis update saat Host menekan Acak)
      roomRef.child('resultGroups').on('value', (snapshot) => {
        const groups = snapshot.val();
        if (groups) {
          currentResultGroups = groups;
          renderResultGroups(groups);
        }
      });
    }

    function submitName() {
      const nameInput = document.getElementById('memberName');
      const genderInput = document.getElementById('memberGender');
      const name = nameInput.value.trim();

      if (!name) return alert('Masukkan nama Anda!');

      const newMemberRef = roomRef.child('members').push();
      newMemberRef.set({
        name: name,
        gender: genderInput.value
      }).then(() => {
        alert('Nama berhasil terkirim!');
        nameInput.value = '';
      });
    }

    function renderMembers() {
      const memberList = document.getElementById('memberList');
      memberList.innerHTML = '';
      const entries = Object.values(currentMembers);
      
      document.getElementById('memberCount').innerText = entries.length;

      entries.forEach(m => {
        const chip = document.createElement('div');
        chip.className = 'member-chip';
        chip.innerText = `${m.name} (${m.gender})`;
        memberList.appendChild(chip);
      });
    }

    function generateGroupsRealtime() {
      const membersArray = Object.values(currentMembers);
      if (membersArray.length === 0) return alert('Belum ada anggota yang bergabung!');

      const groupCount = parseInt(document.getElementById('groupCount').value) || 2;
      const balanceGender = document.getElementById('balanceGender').checked;
      const assignLeader = document.getElementById('assignLeader').checked;

      let males = membersArray.filter(m => m.gender === 'L');
      let females = membersArray.filter(m => m.gender === 'P');

      const shuffle = arr => arr.sort(() => Math.random() - 0.5);
      males = shuffle(males);
      females = shuffle(females);

      const groups = Array.from({ length: groupCount }, () => []);

      if (balanceGender) {
        males.forEach((m, i) => groups[i % groupCount].push(m));
        females.forEach((m, i) => groups[i % groupCount].push(m));
      } else {
        const all = shuffle([...males, ...females]);
        all.forEach((m, i) => groups[i % groupCount].push(m));
      }

      // Tentukan Ketua
      const finalGroups = groups.map(g => {
        const shuffled = shuffle(g);
        return shuffled.map((m, idx) => ({
          ...m,
          isLeader: assignLeader && idx === 0
        }));
      });

      // Simpan ke Firebase agar semua layar anggota otomatis ter-update
      roomRef.child('resultGroups').set(finalGroups);
    }

    function renderResultGroups(groups) {
      const container = document.getElementById('groupsContainer');
      container.innerHTML = '';

      groups.forEach((group, index) => {
        const card = document.createElement('div');
        card.className = 'group-card';
        let html = `<h3>Kelompok ${index + 1} (${group.length} Orang)</h3>`;
        
        group.forEach(m => {
          html += `
            <div class="member-item">
              <span>${m.name} (${m.gender})</span>
              ${m.isLeader ? '<span class="badge-leader">KETUA</span>' : ''}
            </div>
          `;
        });
        
        card.innerHTML = html;
        container.appendChild(card);
      });

      document.getElementById('resultSection').classList.remove('hidden');
    }

    function copyLink() {
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomCode}`;
      navigator.clipboard.writeText(shareUrl);
      alert('Link/Kode berhasil disalin! Kirimkan ke grup WhatsApp.');
    }

    function copyWhatsAppFormat() {
      if (!currentResultGroups.length) return;
      let text = `*HASIL KELOMPOK (${currentRoomCode})*\n\n`;
      currentResultGroups.forEach((group, index) => {
        text += `*Kelompok ${index + 1}*\n`;
        group.forEach(m => {
          text += `• ${m.name} (${m.gender})${m.isLeader ? ' *(Ketua)*' : ''}\n`;
        });
        text += '\n';
      });
      navigator.clipboard.writeText(text);
      alert('Format WA berhasil disalin!');
    }
  </script>
</body>
</html>
